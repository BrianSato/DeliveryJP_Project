{% extends "loja/base.html" %}

{% block title %}Adicionar Lote{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm mx-auto" style="max-width: 500px;">
        <div class="card-body">

            <h3 class="text-center mb-3">📦 Adicionar Lote</h3>

            <p class="text-center text-muted mb-4">
                Produto: <strong>{{ produto.nome_produto }}</strong>
            </p>

            <form method="POST">
                {% csrf_token %}

                <!-- QUANTIDADE -->
                <div class="mb-3">
                    <label class="form-label">Quantidade</label>
                    <input type="number"
                           name="quantidade"
                           class="form-control"
                           placeholder="Digite a quantidade"
                           required>
                </div>

                <!-- DATA DE VALIDADE -->
                <div class="mb-3">
                    <label class="form-label">Data de Validade</label>
                    <input type="date"
                           name="data_validade"
                           class="form-control">
                </div>

                <!-- BOTÕES -->
                <div class="d-grid gap-2 mt-4">

                    <button type="submit" class="btn btn-success">
                        ➕ Adicionar Lote
                    </button>

                    <a href="{% url 'produto_detail' produto.id %}" class="btn btn-outline-secondary">
                        🔙 Voltar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
