{% extends "loja/base.html" %}

{% block title %}Novo Produto{% endblock %}

{% block content %}
    <div style="width: 100%; max-width: 400px;">
        <h2>Novo Produto</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="nome_produto" placeholder="Nome do Produto"
            style="width: 100%; padding: 10px; margin-bottom: 10px;">
            <input type="number" step="0.01" name="preco_unitario" placeholder="Preço"
            style="width: 100%; padding: 10px; margin-bottom: 15px;">

            <button type="submit" class="menu-btn">
            Salvar
            </button>
        </form>
    </div>
{% endblock %}>
