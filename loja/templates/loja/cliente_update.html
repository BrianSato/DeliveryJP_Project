{% extends 'loja/base.html' %}

{% block content %}
<div class="container mt-4">

    <h2>Editar Cliente</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Nome</label>
            {{ form.nome }}
        </div>

        <div>
            <label>Telefone</label>
            {{ form.telefone }}

            {% if form.telefone.errors %}
                <div style="color:red;">
                    {{ form.telefone.errors }}
                </div>
            {% endif %}
        </div>

        <div class="mb-3">
            <label>Endereço</label>
            {{ form.endereco }}
        </div>

        <button type="submit" class="btn btn-primary">
            Salvar
        </button>

        <a href="{% url 'cliente_list' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</div>
{% endblock %}
