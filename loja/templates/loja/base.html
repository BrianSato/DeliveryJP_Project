{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DeliveryJP{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* LOGO PADRÃO */
        .logo{
            width: 120px;
            display: block;
            margin: 0 auto 20px;
        }

        /* BOTÕES GERAIS */
        .menu-btn{
            width: 100%;
            padding: 12px;
            margin: 10px 0 ;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .menu-btn:hover{
            background-color: #45a049;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
        }

        /* container centralizado */
        .main-container{
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        label{
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input,select{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

<div class="main-container">

    <!---BLOCO DE MENSAGENS --->
    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!---BLOCO DE LOGO --->
    {% block logo %}
    <img src="{% static 'loja/img/logo.png' %}" alt="logo" class="logo">
    {% endblock %}

    <!--- BLOCO DE CONTEÚDO --->
    {% block content %}{% endblock %}

</div>

<!-- JS BOOTSTRAP  -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS DO PROJETO -->
<script src="{% static 'loja/js/pedido.js' %}"></script>

</body>
</html>
