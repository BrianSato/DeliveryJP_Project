{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
     <title>{% block title %}DeliveryJP{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* LOGO PADRÃO */
        .logo{
            width: 120px;
            display: block;
            margin: 0 auto 20px;
        }
        /*BOTÕES GERAIS*/
        .menu-btn{
            width: 100%;
            padding: 12px;
            margin: 10px 0 ;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        .menu-btn:hover{
            background-color: #45a049;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!---BLOCO DE LOGO : PODE SER SOBRESCRITO SE NECESSÁRIO --->
    {% block logo %}
    <img src = "{% static 'loja/img/logo.png'%}" alt = "logo" class = "logo">
    {% endblock %}

    <!--- BLOCO DE CONTEÚDO QUE MUDA EM CADA PÁGINA --->
    {% block content %}{% endblock %}

</body>
</html>
