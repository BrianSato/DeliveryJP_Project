{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DeliveryJP{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* LOGO PADRÃO */
        .logo{
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 20px;
        }

        /* BOTÕES GERAIS */
        .menu-btn{
            width: 100%;
            padding: 8px 10px;
            margin: 8px 0;
            font-size: 14px;
            border: 1px solid #0d6efd;
            border-radius: 8px;
            background-color: transparent;
            color: #0d6efd;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .menu-btn:hover{
            background-color: #0d6efd;
            color: white;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
        }

        .main-container{
            max-width: 350px;
            margin: auto;
            padding: 20px;
        }

        label{
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input,select{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .alert.alert-custom {
            padding: 3px 8px !important;
            font-size: 12px !important;
            line-height: 1.2;
        }
        .alert-custom .btn {
            padding: 2px 6px;
            font-size: 12px;
            line-height: 1.2;
        }
    </style>
</head>

<body>

<div class="{% block container_class %}main-container{% endblock %}">

    <!-- MENSAGENS -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- LOGO -->
    {% block logo %}
    <img src="{% static 'loja/img/logo.png' %}" alt="logo" class="logo">
    {% endblock %}

    <!-- CONTEÚDO -->
    {% block content %}{% endblock %}

</div>

<!-- MODAL CONFIRMAÇÃO -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Confirmar ação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p id="confirmMessage">Tem certeza?</p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>

        <button id="confirmBtn" class="btn btn-danger">
          Confirmar
        </button>
      </div>

    </div>
  </div>
</div>
<!-- JS BOOTSTRAP  -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS DO PROJETO -->
<script src="{% static 'loja/js/pedido.js' %}"></script>

<script>
let formToSubmit = null;

function openConfirmModal(message, form) {
    formToSubmit = form;

    document.getElementById('confirmMessage').innerText = message;

    const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
    modal.show();
}

document.getElementById('confirmBtn').addEventListener('click', function () {
    if (formToSubmit) {
        formToSubmit.submit();
    }
});
</script>



</body>
</html>
